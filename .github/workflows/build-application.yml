name: 'Build application'

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'test/**'
      - '*.sln'
      - '*.slnf'
      - '*.config'
      - '*.props'
      - '*.targets'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'test/**'
      - '*.sln'
      - '*.slnf'
      - '*.config'
      - '*.props'
      - '*.targets'

defaults:
  run:
    shell: pwsh

jobs:
  build-common:
    name: 'Build common'

    strategy:
      matrix:
        system:
          - windows-2022
          - ubuntu-22.04
        config:
          - Debug
          - Release

    runs-on: ${{ matrix.system }}

    env:
      Solution: GeneoGraph.Main.slnf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
            Application-NuGet-${{ runner.os }}-
            Application-NuGet-
          path: |
            ~/.nuget/packages

      - name: Restore packages
        run: |
          dotnet restore $env:Solution

      - name: Build application
        run: |
          dotnet build $env:Solution `
            --configuration ${{ matrix.config }} `
            --no-restore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.system }}-${{ matrix.config }}-${{ github.sha }}
          path: bin/${{ matrix.config }}/

  test-common:
    name: 'Test common'

    needs:
      - build-common

    strategy:
      matrix:
        system:
          - windows-2022
          - ubuntu-22.04
        config:
          - Debug
          - Release

    runs-on: ${{ matrix.system }}

    env:
      Solution: GeneoGraph.Main.slnf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
            Application-NuGet-${{ runner.os }}-
            Application-NuGet-
          path: |
            ~/.nuget/packages

      - name: Restore packages
        run: |
          dotnet restore $env:Solution

      - name: Run tests
        run: |
          dotnet test $env:Solution `
            --no-restore

  publish-windows:
    name: 'Publish Windows'

    needs:
      - test-common

    strategy:
      matrix:
        system:
          - windows-2022
        framework:
          - net6.0-windows
          - net7.0-windows
          - net8.0-windows
        runtime:
          - win-x86
          - win-x64
        config:
          - Release

    runs-on: ${{ matrix.system }}

    env:
      Project: src\ImeSense.GeneoGraph.Windows\ImeSense.GeneoGraph.Windows.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
            Application-NuGet-${{ runner.os }}-
            Application-NuGet-
          path: |
            ~/.nuget/packages

      - name: Restore packages
        run: |
          dotnet restore $env:Project

      - name: Publish application
        run: |
          dotnet publish $env:Project `
            --framework ${{ matrix.framework }} `
            --runtime ${{ matrix.runtime }} `
            --configuration ${{ matrix.config }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=None

      - name: Upload application
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}
          path: bin/${{ matrix.config }}/${{ matrix.framework }}/${{ matrix.runtime }}/publish/

      - name: Set output
        run: |
          echo "${{ steps.upload-artifact.outputs.artifact-url }}" >> application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}.url

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}-url
          path: application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}.url

  publish-linux:
    name: 'Publish Linux'

    needs:
      - test-common

    strategy:
      matrix:
        system:
          - ubuntu-22.04
        framework:
          - net6.0
          - net7.0
          - net8.0
        runtime:
          - linux-x64
        config:
          - Release

    runs-on: ${{ matrix.system }}

    env:
      Project: src/ImeSense.GeneoGraph.Linux/ImeSense.GeneoGraph.Linux.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache packages
        uses: actions/cache@v4
        with:
          key: Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            Application-NuGet-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
            Application-NuGet-${{ runner.os }}-
            Application-NuGet-
          path: |
            ~/.nuget/packages

      - name: Restore packages
        run: |
          dotnet restore $env:Project

      - name: Publish application
        run: |
          dotnet publish $env:Project `
            --framework ${{ matrix.framework }} `
            --runtime ${{ matrix.runtime }} `
            --configuration ${{ matrix.config }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugSymbols=false `
            -p:DebugType=None

      - name: Upload application
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}
          path: bin/${{ matrix.config }}/${{ matrix.framework }}/${{ matrix.runtime }}/publish/

      - name: Set output
        run: |
          echo "${{ steps.upload-artifact.outputs.artifact-url }}" >> application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}.url

      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}-url
          path: application-${{ matrix.framework }}-${{ matrix.runtime }}-${{ matrix.config }}-${{ github.sha }}.url

  print-output:
    name: 'Print output'

    needs:
      - publish-windows
      - publish-linux

    strategy:
      matrix:
        system:
          - ubuntu-22.04

    runs-on: ${{ matrix.system }}

    steps:
      - name: Download output
        uses: actions/download-artifact@v4
        with:
          pattern: "*-url"
          path: ./
          merge-multiple: true

      - name: Print summary
        run: |
          echo '## Summary' > summary.md
          echo '' >> summary.md

          echo 'Login GitHub to download artifacts' >> summary.md
          echo '' >> summary.md

          echo '## Publish' >> summary.md
          echo '' >> summary.md

          echo '<table>' >> summary.md
          echo '  <thead>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <th align="center">Target</td>' >> summary.md
          echo '      <th align="center">Framework</td>' >> summary.md
          echo '      <th align="center">File</td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '  </thead>' >> summary.md

          echo '  <tbody>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net6.0-windows</td>' >> summary.md
          echo '      <td>win-x86</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net6.0-windows-win-x86-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net7.0-windows</td>' >> summary.md
          echo '      <td>win-x86</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net7.0-windows-win-x86-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net8.0-windows</td>' >> summary.md
          echo '      <td>win-x86</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net8.0-windows-win-x86-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md

          echo '    <tr>' >> summary.md
          echo '      <td>net6.0-windows</td>' >> summary.md
          echo '      <td>win-x64</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net6.0-windows-win-x64-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net7.0-windows</td>' >> summary.md
          echo '      <td>win-x86</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net7.0-windows-win-x64-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net8.0-windows</td>' >> summary.md
          echo '      <td>win-x64</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net8.0-windows-win-x64-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md

          echo '    <tr>' >> summary.md
          echo '      <td>net6.0</td>' >> summary.md
          echo '      <td>linux-x64</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net6.0-linux-x64-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net7.0</td>' >> summary.md
          echo '      <td>linux-x64</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net7.0-linux-x64-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '    <tr>' >> summary.md
          echo '      <td>net8.0</td>' >> summary.md
          echo '      <td>linux-x64</td>' >> summary.md
          echo '      <td><a href="'$(cat application-net8.0-linux-x64-Release-${{ github.sha }}.url)'">Application</a></td>' >> summary.md
          echo '    </tr>' >> summary.md
          echo '  </tbody>' >> summary.md
          echo '</table>' >> summary.md

          cat summary.md >> $GITHUB_STEP_SUMMARY
        shell:
          bash

      - name: Delete output
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            application-net6.0-windows-win-x86-Release-${{ github.sha }}-url
            application-net7.0-windows-win-x86-Release-${{ github.sha }}-url
            application-net8.0-windows-win-x86-Release-${{ github.sha }}-url
            application-net6.0-windows-win-x64-Release-${{ github.sha }}-url
            application-net7.0-windows-win-x64-Release-${{ github.sha }}-url
            application-net8.0-windows-win-x64-Release-${{ github.sha }}-url
            application-net6.0-linux-x64-Release-${{ github.sha }}-url
            application-net7.0-linux-x64-Release-${{ github.sha }}-url
            application-net8.0-linux-x64-Release-${{ github.sha }}-url
